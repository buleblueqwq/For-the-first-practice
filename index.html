<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#070a10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>2048（yzh是我儿）</title>
<style>
/* ==========================================================
   1. 主题变量
   ========================================================== */
html[data-theme="neon"]{
  --bg:#070a10; --panel:#111923; --cell:#18222e;
  --text:#e8f1ff; --muted:#7c90a6; --accent:#4cc9f0;
  --v2:#1b2b3d;--t2:#a8c8ea; --v4:#1f3a52;--t4:#c6e4ff;
  --v8:#1c5570;--t8:#d8f6ff; --v16:#187a8a;--t16:#d6fbff;
  --v32:#1f9a8a;--t32:#e2fff8; --v64:#4a9c38;--t64:#efffe7;
  --v128:#b3861c;--t128:#fff8dd; --v256:#c2681f;--t256:#fff0dd;
  --v512:#c74434;--t512:#ffe8e3; --v1024:#9c35a6;--t1024:#fbe9ff;
  --v2048:#f0b429;--t2048:#2a1d00;
  --vsuper:#f5f0ff;--tsuper:#2a1d3d;
  --glow:0 0 22px rgba(240,180,41,.55), 0 0 46px rgba(240,180,41,.22);
  --glass-bg:rgba(255,255,255,.075);
  --glass-bg-strong:rgba(255,255,255,.12);
  --glass-border:rgba(255,255,255,.16);
  --glass-line:rgba(255,255,255,.55);
  --glass-top:rgba(255,255,255,.22);
  --glass-shadow:rgba(0,0,0,.5);
  --accent-glass:rgba(76,201,240,.36);
  --accent-line:rgba(150,225,255,.8);
  --accent-shadow:rgba(76,201,240,.5);
  --accent-text:#04121a;
  --aurora-1:rgba(76,201,240,.24);
  --aurora-2:rgba(142,92,255,.22);
  --aurora-3:rgba(240,180,41,.13);
}
html[data-theme="classic"]{
  --bg:#f7f2e6; --panel:#bbada0; --cell:#cdc1b4;
  --text:#5c534b; --muted:#9a8f83; --accent:#f2b179;
  --v2:#eee4da;--t2:#776e65; --v4:#ede0c8;--t4:#776e65;
  --v8:#f2b179;--t8:#f9f6f2; --v16:#f59563;--t16:#f9f6f2;
  --v32:#f67c5f;--t32:#f9f6f2; --v64:#f65e3b;--t64:#f9f6f2;
  --v128:#edcf72;--t128:#f9f6f2; --v256:#edcc61;--t256:#f9f6f2;
  --v512:#edc850;--t512:#f9f6f2; --v1024:#edc53f;--t1024:#f9f6f2;
  --v2048:#edc22e;--t2048:#f9f6f2;
  --vsuper:#3c3a32;--tsuper:#f9f6f2;
  --glow:0 0 18px rgba(237,194,46,.7);
  --glass-bg:rgba(255,255,255,.5);
  --glass-bg-strong:rgba(255,255,255,.66);
  --glass-border:rgba(255,255,255,.8);
  --glass-line:rgba(255,255,255,.98);
  --glass-top:rgba(255,255,255,.85);
  --glass-shadow:rgba(120,100,80,.3);
  --accent-glass:rgba(242,177,121,.72);
  --accent-line:rgba(255,235,215,.95);
  --accent-shadow:rgba(242,177,121,.55);
  --accent-text:#fff;
  --aurora-1:rgba(242,177,121,.38);
  --aurora-2:rgba(245,149,99,.28);
  --aurora-3:rgba(237,194,46,.24);
}
html[data-theme="macaron"]{
  --bg:#fdf6f8; --panel:#f0dfe6; --cell:#e8d3dc;
  --text:#6b5560; --muted:#a4909b; --accent:#f29bb5;
  --v2:#f7e8ef;--t2:#8a6274; --v4:#fbe3d6;--t4:#96604a;
  --v8:#ffe6c7;--t8:#9a6a2e; --v16:#d9f0d4;--t16:#4f7a48;
  --v32:#cfeadf;--t32:#3c6f5f; --v64:#d6e4f7;--t64:#3f5d80;
  --v128:#e2dcf7;--t128:#5a4f80; --v256:#f6d9e3;--t256:#8a4f66;
  --v512:#f9cfc9;--t512:#8a4a44; --v1024:#e8d3f5;--t1024:#6b4a80;
  --v2048:#ffd98a;--t2048:#5a3d00;
  --vsuper:#c9b8ff;--tsuper:#2e2450;
  --glow:0 0 18px rgba(255,200,90,.75);
  --glass-bg:rgba(255,255,255,.5);
  --glass-bg-strong:rgba(255,255,255,.66);
  --glass-border:rgba(255,255,255,.82);
  --glass-line:rgba(255,255,255,.98);
  --glass-top:rgba(255,255,255,.85);
  --glass-shadow:rgba(150,110,130,.28);
  --accent-glass:rgba(242,155,181,.7);
  --accent-line:rgba(255,225,235,.95);
  --accent-shadow:rgba(242,155,181,.55);
  --accent-text:#fff;
  --aurora-1:rgba(242,155,181,.38);
  --aurora-2:rgba(180,160,240,.3);
  --aurora-3:rgba(255,215,150,.3);
}

/* ==========================================================
   2. 基础
   ========================================================== */
*,*::before,*::after{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  overscroll-behavior:none;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
  transition:background-color .3s ease,color .3s ease;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}

.aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58% 44% at 14% 6%,  var(--aurora-1) 0%, transparent 70%),
    radial-gradient(54% 40% at 88% 20%, var(--aurora-2) 0%, transparent 70%),
    radial-gradient(70% 48% at 50% 102%,var(--aurora-3) 0%, transparent 72%);
  animation:auroraDrift 26s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes auroraDrift{
  0%  {transform:translate3d(-2%,-1%,0) scale(1.00);}
  50% {transform:translate3d(2.5%,2%,0) scale(1.07);}
  100%{transform:translate3d(-1%,3%,0) scale(1.03);}
}

/* ==========================================================
   3. 玻璃核心
   ========================================================== */
.glass{
  position:relative;isolation:isolate;
  background-color:var(--glass-bg);
  background-image:linear-gradient(180deg,
      var(--glass-top) 0%,
      rgba(255,255,255,.05) 34%,
      rgba(255,255,255,0) 62%);
  -webkit-backdrop-filter:blur(22px) saturate(185%);
          backdrop-filter:blur(22px) saturate(185%);
  box-shadow:
    inset 0  1px 0 0 var(--glass-top),
    inset 0 -1px 0 0 rgba(0,0,0,.10),
    0 10px 28px -10px var(--glass-shadow),
    0  2px  8px  -3px var(--glass-shadow);
  transition:background-color .28s ease,box-shadow .28s ease;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(145deg,
      var(--glass-line) 0%,
      rgba(255,255,255,.06) 24%,
      rgba(255,255,255,0)  48%,
      rgba(255,255,255,.06) 72%,
      var(--glass-line) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}

/* ==========================================================
   4. 布局
   ========================================================== */
.app{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;gap:8px;
  padding:
    calc(env(safe-area-inset-top,0px) + 10px)
    calc(env(safe-area-inset-right,0px) + 12px)
    calc(env(safe-area-inset-bottom,0px) + 10px)
    calc(env(safe-area-inset-left,0px) + 12px);
}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;}
.logo{
  margin:0;font-size:clamp(22px,7vw,30px);font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--accent),var(--text));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin:2px 0 0;font-size:11px;color:var(--muted);}
.hud-right{display:flex;align-items:stretch;gap:8px;}

.score-card{
  position:relative;min-width:82px;padding:6px 12px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.score-label{font-size:10px;letter-spacing:.08em;color:var(--muted);}
.score-value{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;}
.stat-col{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  font-size:10.5px;line-height:1.4;color:var(--muted);
}
.stat-col b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}

/* HUD 音效小按钮 */
.icon-btn{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;
  align-self:center;
}

.score-pop{
  position:absolute;left:50%;top:3px;transform:translateX(-50%);
  font-size:13px;font-weight:800;color:var(--accent);pointer-events:none;
  text-shadow:0 0 12px var(--accent-shadow);
  animation:floatUp .7s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,6px) scale(.85);}
  25%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-26px) scale(1.05);}
}

/* 棋盘 */
.stage{flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.board{
  position:relative;border-radius:18px;background:var(--panel);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 0 rgba(0,0,0,.22),
    0 14px 34px -16px rgba(0,0,0,.6);
  transition:background-color .3s ease;
  touch-action:none;
}
.board-cells{
  position:absolute;inset:var(--gap,8px);display:grid;
  grid-template-columns:repeat(var(--n,4),1fr);
  grid-template-rows:repeat(var(--n,4),1fr);
  gap:var(--gap,8px);
}
.cell{border-radius:9px;background:var(--cell);transition:background-color .3s ease;}

/* 方块 */
.tile{
  position:absolute;top:0;left:0;will-change:transform;
  transition:transform 110ms cubic-bezier(.25,.8,.35,1);
  z-index:2;
}
.no-anim .tile{transition:none !important;}
.tile-inner{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border-radius:9px;font-weight:900;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -2px 6px rgba(0,0,0,.12);
  transition:background-color .16s ease,color .16s ease,box-shadow .2s ease;
  will-change:transform;
}
.tile[data-v="2"]    .tile-inner{background:var(--v2);   color:var(--t2);}
.tile[data-v="4"]    .tile-inner{background:var(--v4);   color:var(--t4);}
.tile[data-v="8"]    .tile-inner{background:var(--v8);   color:var(--t8);}
.tile[data-v="16"]   .tile-inner{background:var(--v16);  color:var(--t16);}
.tile[data-v="32"]   .tile-inner{background:var(--v32);  color:var(--t32);}
.tile[data-v="64"]   .tile-inner{background:var(--v64);  color:var(--t64);}
.tile[data-v="128"]  .tile-inner{background:var(--v128); color:var(--t128);}
.tile[data-v="256"]  .tile-inner{background:var(--v256); color:var(--t256);}
.tile[data-v="512"]  .tile-inner{background:var(--v512); color:var(--t512);}
.tile[data-v="1024"] .tile-inner{background:var(--v1024);color:var(--t1024);}
.tile[data-v="2048"] .tile-inner{background:var(--v2048);color:var(--t2048);box-shadow:var(--glow);}
.tile.is-super .tile-inner{background:var(--vsuper);color:var(--tsuper);box-shadow:var(--glow);}

.tile.is-new .tile-inner{animation:appear .18s cubic-bezier(.34,1.56,.64,1);}
@keyframes appear{from{transform:scale(.25);opacity:0;}to{transform:scale(1);opacity:1;}}
.tile.is-merged .tile-inner{animation:pop .19s ease-out;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.2);}100%{transform:scale(1);}}

/* ==========================================================
   5. 液态玻璃按钮（华为式光影）
   ========================================================== */
.toolbar{
  flex:0 0 auto;display:flex;gap:9px;justify-content:center;
  padding:2px 0 4px;
}
.btn{
  position:relative;flex:1 1 0;min-width:0;height:46px;
  border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:13px;font-weight:700;letter-spacing:.01em;
  color:var(--text);
  overflow:hidden;isolation:isolate;
  background-color:var(--glass-bg);
  background-image:linear-gradient(180deg,
      var(--glass-top) 0%,
      rgba(255,255,255,.05) 32%,
      rgba(255,255,255,0) 60%);
  -webkit-backdrop-filter:blur(22px) saturate(185%);
          backdrop-filter:blur(22px) saturate(185%);
  box-shadow:
    inset 0  1px 0 0 var(--glass-top),
    inset 0 -1px 0 0 rgba(0,0,0,.10),
    0 10px 26px -10px var(--glass-shadow),
    0  2px  8px  -3px var(--glass-shadow);
  transition:
    background-color .24s ease,
    box-shadow .28s ease,
    transform 380ms cubic-bezier(.34,1.56,.64,1);
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  outline:none;
}
.btn:focus-visible{
  box-shadow:
    inset 0 1px 0 0 var(--glass-top),
    0 0 0 2px var(--accent-shadow),
    0 10px 26px -10px var(--glass-shadow);
}

/* 边缘折射描边（常态） */
.btn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(145deg,
      var(--glass-line) 0%,
      rgba(255,255,255,.05) 22%,
      rgba(255,255,255,0)  48%,
      rgba(255,255,255,.05) 74%,
      var(--glass-line) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;z-index:2;
  transition:filter .28s ease;
}

/* 光泽扫过层（按下触发） */
.btn::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(105deg,
      transparent 30%,
      rgba(255,255,255,0)   42%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0)   58%,
      transparent 70%);
  opacity:0;pointer-events:none;z-index:1;
  transform:translateX(-100%);
  mix-blend-mode:screen;
}

/* 按下：缩放 + 内阴影 + 边缘发光 + 光扫 */
.btn.is-pressed,
.btn:active{
  transform:scale(.93);
  transition:
    background-color .12s ease,
    box-shadow .12s ease,
    transform 90ms cubic-bezier(.4,0,.6,1);
  background-color:var(--glass-bg-strong);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.45),
    inset 0 7px 18px -8px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.22),
    0 0 18px 2px var(--accent-shadow),
    0 4px 14px -8px var(--glass-shadow);
}
.btn.is-pressed::after,
.btn:active::after{
  background:linear-gradient(145deg,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.25) 30%,
      rgba(255,255,255,.08) 50%,
      rgba(255,255,255,.25) 70%,
      rgba(255,255,255,.95) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.7))
         drop-shadow(0 0 10px var(--accent-shadow));
}
.btn.is-pressed::before,
.btn:active::before{
  opacity:1;
  animation:sheenSweep 680ms cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes sheenSweep{
  0%   {transform:translateX(-100%);}
  100% {transform:translateX(100%);}
}

.btn:disabled{
  opacity:.38;
  transform:none;
  box-shadow:
    inset 0 1px 0 0 var(--glass-top),
    0 4px 12px -8px var(--glass-shadow);
}
.btn:disabled::before,
.btn:disabled::after{animation:none;}

/* 主按钮 */
.btn.primary{
  background-color:var(--accent-glass);
  background-image:linear-gradient(180deg,
      rgba(255,255,255,.4) 0%,
      rgba(255,255,255,.1) 34%,
      rgba(255,255,255,0)  62%);
  color:var(--accent-text);
  box-shadow:
    inset 0  1px 0 0 rgba(255,255,255,.55),
    inset 0 -1px 0 0 rgba(0,0,0,.08),
    0 10px 28px -10px var(--accent-shadow),
    0  2px  8px  -3px var(--glass-shadow);
}
.btn.primary::after{
  background:linear-gradient(145deg,
      var(--accent-line) 0%,
      rgba(255,255,255,.08) 24%,
      rgba(255,255,255,0)   48%,
      rgba(255,255,255,.08) 74%,
      var(--accent-line) 100%);
}

/* JS 动态涟漪 & 触点光晕 */
.ripple{
  position:absolute;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,
      rgba(255,255,255,.7) 0%,
      rgba(255,255,255,.3) 28%,
      rgba(255,255,255,.08) 52%,
      rgba(255,255,255,0)   70%);
  transform:scale(0);
  mix-blend-mode:screen;
  animation:rippleExpand 780ms cubic-bezier(.2,.7,.3,1) forwards;
}
@supports (background: color-mix(in srgb, white, white)) {
  .ripple{
    background:radial-gradient(circle,
        color-mix(in srgb, var(--accent) 60%, white) 0%,
        color-mix(in srgb, var(--accent) 30%, transparent) 35%,
        color-mix(in srgb, var(--accent) 12%, transparent) 55%,
        transparent 72%);
  }
  .touch-glow{
    box-shadow:
      0 0 22px 9px color-mix(in srgb, var(--accent) 40%, transparent),
      0 0 46px 18px color-mix(in srgb, var(--accent) 14%, transparent);
  }
}
@keyframes rippleExpand{
  0%   {transform:scale(0); opacity:.95;}
  55%  {                    opacity:.55;}
  100% {transform:scale(1); opacity:0;}
}

.touch-glow{
  position:absolute;width:0;height:0;pointer-events:none;z-index:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 22px 9px rgba(255,255,255,.4),
    0 0 46px 18px rgba(255,255,255,.14);
  animation:glowBurst 640ms ease-out forwards;
}
@keyframes glowBurst{
  0%   {opacity:0; transform:translate(-50%,-50%) scale(.35);}
  38%  {opacity:1;}
  100% {opacity:0; transform:translate(-50%,-50%) scale(1.15);}
}

.badge{
  font-size:10px;font-weight:800;line-height:1;padding:3px 6px;border-radius:999px;
  color:var(--accent-text);
  background-color:var(--accent-glass);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
          backdrop-filter:blur(10px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    0 2px 6px -2px var(--accent-shadow);
}

/* ==========================================================
   6. 彩蛋 Toast
   ========================================================== */
.egg-toast{
  position:fixed;left:50%;top:20%;
  transform:translate(-50%,-18px) scale(.92);
  z-index:55;
  display:flex;align-items:center;gap:10px;
  padding:14px 22px;
  border-radius:18px;
  background-color:var(--glass-bg-strong);
  background-image:linear-gradient(180deg,
      var(--glass-top) 0%,
      rgba(255,255,255,.05) 35%,
      rgba(255,255,255,0)  65%);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
          backdrop-filter:blur(28px) saturate(200%);
  box-shadow:
    inset 0 1px 0 var(--glass-top),
    inset 0 -1px 0 rgba(0,0,0,.1),
    0 20px 50px -18px var(--glass-shadow),
    0 0 30px -6px var(--accent-shadow),
    0 6px 16px -6px var(--glass-shadow);
  color:var(--text);
  font-size:15px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .5s cubic-bezier(.34,1.56,.64,1);
  max-width:88vw;
}
.egg-toast::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,
      var(--glass-line) 0%,
      rgba(255,255,255,.06) 30%,
      rgba(255,255,255,0)  50%,
      rgba(255,255,255,.06) 70%,
      var(--glass-line) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.egg-toast.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}
.egg-emoji{font-size:20px;line-height:1;filter:drop-shadow(0 0 10px var(--accent-shadow));}
.egg-text{overflow:hidden;text-overflow:ellipsis;}

/* ==========================================================
   7. 弹窗
   ========================================================== */
.modal{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
          backdrop-filter:blur(10px) saturate(140%);
  opacity:0;pointer-events:none;
  transition:opacity .24s ease;
}
.modal.show{opacity:1;pointer-events:auto;}
.modal-card{
  position:relative;
  width:min(88vw,366px);max-height:80vh;overflow:auto;
  border-radius:24px;padding:24px 22px;
  background-color:var(--glass-bg-strong);
  background-image:linear-gradient(180deg,
      var(--glass-top) 0%,
      rgba(255,255,255,.06) 30%,
      rgba(255,255,255,0)  60%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
          backdrop-filter:blur(30px) saturate(190%);
  box-shadow:
    inset 0  1px 0 0 var(--glass-top),
    inset 0 -1px 0 0 rgba(0,0,0,.10),
    0 24px 60px -20px var(--glass-shadow),
    0  6px 18px  -6px var(--glass-shadow);
  transform:translateY(16px) scale(.94);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4);
  -webkit-overflow-scrolling:touch;
}
.modal-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,
      var(--glass-line) 0%,
      rgba(255,255,255,.06) 26%,
      rgba(255,255,255,0)  50%,
      rgba(255,255,255,.06) 76%,
      var(--glass-line) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
